<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties for Sale &amp; Rent — Gulberg Greens &amp; DHA Islamabad | Homes PK Marketing</title>
<meta name="description" content="Browse houses, plots, flats, farmhouses and commercial properties for sale and rent in Gulberg Greens and DHA Islamabad with Homes PK Marketing.">
<link rel="canonical" href="https://kamranproperty.com/properties.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="properties">

<div id="site-header"></div>

<main>
  <section class="tight">
    <div class="container">
      <div class="section-head" style="margin-bottom:30px;">
        <p class="eyebrow">All Listings</p>
        <h2>Our <span class="accent-italic">Listings</span></h2>
      </div>

      <div class="filter-bar">
        <select id="fType" class="filter-pill">
          <option value="">All Types</option>
          <option value="House">House</option>
          <option value="Plot">Plot</option>
          <option value="Flat">Flat</option>
          <option value="Farmhouse">Farmhouse</option>
          <option value="Commercial">Commercial</option>
        </select>
        <select id="fLocation" class="filter-pill">
          <option value="">All Locations</option>
          <option value="Gulberg Greens">Gulberg Greens</option>
          <option value="DHA Islamabad">DHA Islamabad</option>
        </select>
        <select id="fStatus" class="filter-pill" aria-label="Status">
          <option value="">All</option>
          <option value="for-sale">For Sale</option>
          <option value="for-rent">For Rent</option>
          <option value="sold">Sold</option>
        </select>
        <select id="fPrice" class="filter-pill">
          <option value="">Any Price</option>
          <option value="under-2000000">Under 20 Lac</option>
          <option value="2000000-10000000">20 Lac – 1 Crore</option>
          <option value="10000000-50000000">1 – 5 Crore</option>
          <option value="50000000-plus">5 Crore+</option>
        </select>
        <input type="text" id="fSearch" class="filter-pill" placeholder="Search by title or location..." style="min-width:220px;">
      </div>

      <p id="resultsCount" style="color:var(--muted); font-size:0.9rem; margin-bottom:24px;"></p>

      <div class="grid" id="propertiesGrid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<div id="floating-whatsapp"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script src="js/properties-data.js"></script>
<script src="js/properties.js"></script>
<script src="js/properties-page.js"></script>
</body>
</html>
